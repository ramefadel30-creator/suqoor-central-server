const L=[
{q:'nlh',b:[[700,460,16,80,'w'],[790,460,16,80,'w'],[745,412,120,16,'w']],p:[[745,482],[745,386]]},
{q:'nmlp',b:[[660,460,18,80,'s'],[760,460,18,80,'s'],[710,411,120,18,'w'],[710,372,16,60,'w'],[710,335,90,14,'w'],[880,460,16,80,'w'],[940,460,16,80,'w'],[910,412,80,16,'w']],p:[[710,482],[710,310],[910,482]]},

function gen(n){let sd=n*7919+13;const R=()=>(sd=sd*16807%2147483647)/2147483647,b=[],p=[],cnt=n<4?1+(n>2?1:0):n<6?2:3,xs=[[690],[620,800],[600,740,880]][cnt-1],pick=()=>R()<Math.min(.75,.4+n*.04)?'s':'w';
 const nm=Math.min(3,1+Math.floor(n/6));for(let i=0;i<nm;i++){const sz=40+Math.floor(R()*30);b.push([330+i*75+Math.floor(R()*30),G,sz,sz,'t',.785])}
 xs.forEach(cx=>{const k=Math.floor(R()*4),m=pick(),m2=pick(),e=n>2&&R()<.55?[30,60,90][Math.floor(R()*3)]:0,i0=b.length,j0=p.length;
  if(k==0){b.push([cx-45,460,16,80,m],[cx+45,460,16,80,m],[cx,412,120,16,'w']);p.push([cx,482],[cx,386]);if(R()<.6||n>5){b.push([cx-40,374,14,60,m2],[cx+40,374,14,60,m2],[cx,336,110,16,'w']);p.push([cx,310])}}
  else if(k==1){const h=3+Math.floor(R()*3);for(let i=0;i<h;i++)b.push([cx,485-i*30,40,30,i%2?'w':m]);p.push([cx,500-h*30-18],[cx+55,482])}
  else if(k==2){b.push([cx-50,440,18,120,'s'],[cx+50,440,18,120,'s'],[cx,372,130,16,'w']);p.push([cx,346],[cx,482])}
  else{b.push([cx-38,488,36,24,m],[cx,488,36,24,m],[cx+38,488,36,24,m],[cx-19,464,36,24,'w'],[cx+19,464,36,24,'w'],[cx,440,36,24,m2]);p.push([cx,410])}
  if(e){for(let i=i0;i<b.length;i++)b[i][1]-=e;for(let j=j0;j<p.length;j++)p[j][1]-=e;b.push([cx,G-e/2,150,e,'t'])}});
 const nb=Math.min(7,Math.max(3,Math.ceil(p.length*.62)+1));
 return{q:Array.from({length:nb},(_,i)=>i==0?'n':'lmhpr'[(i-1+n)%5]).join(''),b,p}}

let CFG={sc:1,op:1,sens:1,pos:{}};try{Object.assign(CFG,JSON.parse(localStorage.getItem('dfcfg')||'{}'))}catch(e){}
let bank=0,UP={l:0,s:0,m:0,mats:{f:0,m:0,c:0},smoke:0,pot:0,amm:0};try{bank=+localStorage.getItem('dfb')||0;UP=Object.assign(UP,JSON.parse(localStorage.getItem('dfu2')||'{}'))}catch(e){}
let lc=0,scv=null,TS=1,paused=false,pzv=null,bgv=null,tf=0,EX=0,vtr=null,camX=0,camHold=0,cap=null,lastAim=null,stick=null,showJs=0,aim=null,well=null,showFr=0,snap=null,shake=0,ds=0,S=1,ox=0,oy=0,bodies=[],queue=[],cur=null,drag=0,lvl=0,score=0,state='menu',parts=[],t=0,settle=0,endT=0,bs=[0];
let rot=false;function fit(){rot=innerHeight>innerWidth;document.documentElement.classList.toggle('rot',rot);const d=devicePixelRatio||1,w=rot?innerHeight:innerWidth,h=rot?innerWidth:innerHeight;cv.width=w*d;cv.height=h*d;S=Math.min(cv.width/W,cv.height/H);ox=(cv.width-W*S)/2;oy=(cv.height-H*S)/2}
addEventListener('orientationchange',()=>setTimeout(fit,150));
addEventListener('resize',fit);fit();
function mk(k,o){const b=Object.assign({k,vx:0,vy:0,a:0,w:0,c:0,hurt:0,sq:0},o);if(b.r){b.hw=b.hh=b.r;b.I=.5*b.m*b.r*b.r}else b.I=b.m*(b.hw*b.hw+b.hh*b.hh)/3;b.im=1/b.m;b.iI=1/b.I;return b}
function mkBird(k){return mk('f',{t:k,r:13,m:10,hp:1e9,x:SX-130,y:SY,idle:0,used:0,age:0,ent:36,ammo:k=='p'?8:k=='r'?4:0,fuel:isP(k)?300:0})}

function nextBird(){lastAim=null;cur=queue.length?mkBird(queue.shift()):null;settle=0;if(cur){const k=cur.t;setTimeout(()=>{if(cur&&cur.t==k)sVoice(k,.4)},450)}}
function ov(h){o.innerHTML=h;o.style.display='flex'}
let unl=1;try{unl=+localStorage.getItem('dfu')||1}catch(e){}
function save(n){if(n>unl){unl=n;try{localStorage.setItem('dfu',n)}catch(e){}}}
function pickL(n){bs=[];score=0;go(n)}

const SHP={l:['❤ حياة إضافية',[100,200,300],'+1 حياة بأول كل مرحلة'],s:['🛡 درع البداية',[150,300],'حماية 10 ثواني بأول المرحلة'],m:['🧲 مغناطيس العملات',[120,240],'يلتقط العملات من مسافة أبعد']};
function shop(){ov(`<h1>🛒 المتجر</h1><p>🪙 ${bank}</p>`+Object.keys(SHP).map(k=>{const[n,cs,d]=SHP[k],lv=UP[k],mx=cs.length,off=lv>=mx||bank<cs[lv];return `<button ${off?'class="lv" disabled':''} style="font-size:18px;padding:6px 18px;width:min(86vw,360px)" onclick="buy('${k}')">${n} (${lv}/${mx}) — ${lv>=mx?'مكتمل':cs[lv]+' 🪙'}<br><small>${d}</small></button>`}).join('')+petsHtml()+'<button onclick="menu()">رجوع</button>')}

function finish(w){state='end';frUp();w?sWin():sLose();rs.style.display=mn.style.display='none';if(w){save(lvl+2);const left=queue.length+(cur?1:0);score+=left*10000;const s=left>=2?3:left==1?2:1,st=[0,1,2].map(i=>`<span class="sr${i<s?' on':''}" style="--i:${i}">★</span>`).join('');for(let i=0;i<s;i++)setTimeout(()=>sStar(i),650+i*350);goldRain();

 else ov(`<h1>كسبت!</h1><div class="st">${st}</div><p>النتيجة: ${score}</p><button onclick="go(lvl+1)">المرحلة التالية</button><button class="g" onclick="go(lvl)">إعادة المرحلة</button><button class="g" onclick="menu()">القائمة</button>`)}
